allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
# next: backport of vercel/next.js#98168 (issue #96538). A client leaving
# mid-request made the image optimizer hang that image and width for everyone
# until a restart. Drop the patch once a stable Next contains the fix
# (16.4.0+); how to check and upgrade: docs/aktualizacja-nextjs.md
patchedDependencies:
  next@16.3.6: patches/next@16.3.6.patch
